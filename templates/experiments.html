<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }

    .card {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
    }

    .active {
        border: 2px solid green;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 500px;
    }

    input,
    textarea,
    button {
        padding: 8px;
    }

    textarea {
        resize: vertical;
    }
</style>

<h2>Active Experiment</h2>
<div id="activeExperiment">Loading...</div>

<hr>

<h2>Create New Experiment</h2>

<form id="createExperimentForm">
    <input type="text" name="experiment_id" placeholder="Experiment ID" required>
    <input type="text" name="name" placeholder="Experiment Name" required>
    <input type="text" name="crop" placeholder="Crop" required>

    <label>Start Time</label>
    <input type="datetime-local" name="start_time" required>

    <textarea name="notes" rows="4" placeholder="Notes"></textarea>

    <button type="submit">Create Experiment</button>
</form>

<p id="createStatus"></p>

<hr>

<h2>Select Active Experiment</h2>

<select id="experimentDropdown">
    <option value="">Loading...</option>
</select>

<button id="setActiveButton">Set Active</button>

<div id="selectedExperimentDetails"></div>

<hr>

<h2>Download SQL Database</h2>

<div class="download-database">
    <button type="button" id="download-database-button">
        Download Database
    </button>

    <p id="database-download-status"></p>
</div>

<hr>

<h2>Download Image Dataset</h2>

<div class="download-image-dataset">
    <label for="image-dataset-experiment">
        Select image dataset
    </label>

    <select id="image-dataset-experiment">
        <option value="">Loading...</option>
    </select>

    <button type="button" id="download-image-dataset-button">
        Download Images
    </button>

    <p id="image-download-status"></p>
</div>







<script>
let experiments = [];

async function loadActiveExperiment() {
    const response = await fetch("/experiments/get_active_experiment");
    const data = await response.json();

    const container = document.getElementById("activeExperiment");

    if (!data.experiment) {
        container.innerHTML = "<em>No active experiment selected.</em>";
        return;
    }

    const exp = data.experiment;

    container.innerHTML = `
        <strong>${exp.name}</strong><br>
        ID: ${exp.experiment_id}<br>
        Crop: ${exp.crop}<br>
        Start: ${exp.start_time}<br>
        Notes: ${exp.notes || ""}
    `;
}


async function loadExperiments() {
    const response = await fetch("/experiments/get_all_experiments");
    const data = await response.json();

    experiments = data.experiments || [];

    const activeDropdown =
        document.getElementById("experimentDropdown");

    const downloadDropdown =
        document.getElementById("image-dataset-experiment");

    if (experiments.length === 0) {
        activeDropdown.innerHTML = `
            <option value="">No experiments found</option>
        `;

        downloadDropdown.innerHTML = `
            <option value="">No experiments found</option>
            <option value="__all__">All experiments</option>
        `;

        return;
    }

    // Populate active-experiment dropdown
    activeDropdown.innerHTML = experiments.map(exp => `
        <option value="${exp.experiment_id}">
            ${exp.name} — ${exp.crop} — ${exp.start_time}
        </option>
    `).join("");

    // Populate image-download dropdown
    downloadDropdown.innerHTML = `
        <option value="">Choose an experiment</option>
        <option value="__all__">All experiments</option>
        <option value="active">Active experiment</option>

        ${experiments.map(exp => `
            <option value="${exp.experiment_id}">
                ${exp.name} — ${exp.experiment_id}
            </option>
        `).join("")}
    `;

    showSelectedExperimentDetails();
}

function showSelectedExperimentDetails() {
    const dropdown = document.getElementById("experimentDropdown");
    const selectedId = dropdown.value;

    const exp = experiments.find(e => e.experiment_id === selectedId);
    const details = document.getElementById("selectedExperimentDetails");

    if (!exp) {
        details.innerHTML = "";
        return;
    }

    details.innerHTML = `
        <h3>Selected Experiment</h3>
        <strong>${exp.name}</strong><br>
        ID: ${exp.experiment_id}<br>
        Crop: ${exp.crop}<br>
        Start: ${exp.start_time}<br>
        Notes: ${exp.notes || ""}
    `;
}

async function setActiveExperiment(experimentId) {
    const response = await fetch("/experiments/set_active_experiment", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            experiment_id: experimentId
        })
    });

    const data = await response.json();

    if (!data.ok) {
        alert(data.error || "Failed to set active experiment");
        return;
    }

    await loadActiveExperiment();
    await loadExperiments();
}

document.getElementById("experimentDropdown").addEventListener("change", () => {
    showSelectedExperimentDetails();
});

document.getElementById("setActiveButton").addEventListener("click", async () => {
    const experimentId = document.getElementById("experimentDropdown").value;

    if (!experimentId) {
        alert("Please select an experiment.");
        return;
    }

    await setActiveExperiment(experimentId);
});

document.getElementById("createExperimentForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const form = new FormData(this);

    const payload = {
        experiment_id: form.get("experiment_id"),
        name: form.get("name"),
        crop: form.get("crop"),
        start_time: form.get("start_time").replace("T", " ") + ":00",
        notes: form.get("notes")
    };

    const response = await fetch("/experiments/create_new_experiment", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
    });

    const data = await response.json();

    const status = document.getElementById("createStatus");

    if (!data.ok) {
        status.innerText = data.error || "Failed to create experiment";
        return;
    }

    status.innerText = `Created ${data.experiment_id}`;

    this.reset();

    await loadExperiments();
    await loadActiveExperiment();
});

document
    .getElementById("download-database-button")
    .addEventListener("click", () => {
        const status = document.getElementById(
            "database-download-status"
        );

        status.innerText = "Preparing download...";

        window.location.href =
            "/experiments/download_database";

        setTimeout(() => {
            status.innerText = "";
        }, 2000);
    });

document
    .getElementById("download-image-dataset-button")
    .addEventListener("click", () => {
        const dropdown = document.getElementById(
            "image-dataset-experiment"
        );

        const status = document.getElementById(
            "image-download-status"
        );

        const experimentId = dropdown.value;

        if (!experimentId) {
            status.innerText = "Please select an image dataset.";
            return;
        }

        let downloadUrl;

        if (experimentId === "__all__") {
            downloadUrl =
                "/experiments/download_image_dataset";
        } else {
            downloadUrl =
                "/experiments/download_image_dataset/" +
                encodeURIComponent(experimentId);
        }

        status.innerText = "Preparing download...";

        window.location.href = downloadUrl;

        // Clear the message after the browser starts the request
        setTimeout(() => {
            status.innerText = "";
        }, 2000);
    });

loadActiveExperiment();
loadExperiments();
</script>
